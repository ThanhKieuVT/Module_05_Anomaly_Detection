groups:
  - name: fscad
    rules:
      - alert: FscadDrift
        expr: max by (product) (fscad_drift_flag) == 1
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Input drift detected for {{ $labels.product }}"
      - alert: FscadHighRejectionRate
        expr: rate(fscad_rejections_total[5m]) / clamp_min(sum(rate(fscad_predictions_total[5m])), 1e-9) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than 10% of images rejected as unknown products"
      - alert: FscadSlowInference
        expr: histogram_quantile(0.95, sum by (le) (rate(fscad_latency_seconds_bucket{stage="total"}[5m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 500 ms"
