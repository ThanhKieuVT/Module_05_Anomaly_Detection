[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fscad"
version = "0.1.0"
description = "Few-Shot Continual Anomaly Detection with Routed Low-Rank Adapters on Frozen Vision Foundation Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]
mlops = [
    "mlflow>=3.0",
    "dvc>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "evidently>=0.4",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "pandas>=2.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff==0.17.3",
    "black==26.10.1",
    "pre-commit>=3.5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.scripts]
fscad-train = "fscad.train:main"
fscad-evaluate = "fscad.evaluate:main"
fscad-continual = "fscad.continual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
extend-exclude = "third_party"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"serving/app.py" = ["B008"]  # FastAPI File()/Form() defaults are the intended idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
